# Render blueprint for the Trace cloud backend.
#
# "New → Blueprint" in Render reads this file and provisions the web service
# (built from the Dockerfile). Database is hosted on Supabase (external).
# Render prompts for the secret values marked `sync: false` — paste the values
# from your Supabase project settings + .env.example.
#
# Tier note: Starter (paid) is chosen deliberately — a free web service sleeps
# after ~15 min idle. Downgrade to free only for a throwaway one-off test.

services:
  - type: web
    name: trace-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health
    # Session artifacts — meta.json, connection.json, specs/*.yaml — are written to the
    # filesystem. Without a disk that is the CONTAINER filesystem, which Render replaces
    # on every deploy and restart, so a redeploy silently destroyed in-progress work.
    #
    # That is not only inconvenient. connection.json carries external_user_id, the key
    # the per-agent memory store is named after; losing it let deploys name a store with
    # no owner in it, which two accounts could then share. The code no longer trusts that
    # file for the owner (sessions.owner_of), but the artifacts still need to survive.
    # COSTS MONEY (~$0.25/GB/month) and pins the service to ONE instance — Render
    # cannot run two against a single disk, so this also gives up zero-downtime
    # deploys. 1GB because these are JSON and YAML artifacts, not media.
    #
    # If neither trade is worth it, delete this block and the env var below: the
    # cross-account leak it relates to is already closed in code (sessions.owner_of
    # resolves the owner from Supabase, not from the file). What you lose without a
    # disk is in-progress sessions surviving a redeploy. The other way out is moving
    # artifacts to Supabase Storage, which costs nothing extra and is already on the
    # roadmap for large artifacts.
    disk:
      name: trace-sessions
      mountPath: /data
      sizeGB: 1
    envVars:
      # Point the app at the mounted disk. app.py already honours this (the --sessions
      # default), so this is the only wiring the persistence needs.
      - key: TRACE_SESSIONS_ROOT
        value: /data/sessions
      # Bind all interfaces in the cloud; Render injects $PORT automatically, so
      # PORT is not declared here. Locally, HOST defaults to 127.0.0.1.
      - key: HOST
        value: 0.0.0.0
      # Secrets — Render prompts for these on deploy; values never live in the repo.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PIPEDREAM_PROJECT_ID
        sync: false
      - key: PIPEDREAM_CLIENT_ID
        sync: false
      - key: PIPEDREAM_CLIENT_SECRET
        sync: false
      - key: PIPEDREAM_ENVIRONMENT
        sync: false
      # App session secret — Render generates a strong random value.
      - key: SESSION_SECRET
        generateValue: true
      # Admin portal token — any long random string; leave BLANK/unset to keep the
      # admin portal disabled (it fails closed).
      - key: TRACE_ADMIN_TOKEN
        sync: false
      # Email notifications (frame 18) and team invites. Both must be set for anything
      # to send; with either missing the app runs and notifications stay in-app only.
      # EMAIL_FROM must use a domain verified in Resend or every send is refused.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # IANA timezone for scheduled deployments' cron (e.g. America/New_York —
      # the default when unset). "Daily · 9am" fires at 9am in this zone.
      - key: TRACE_SCHEDULE_TZ
        sync: false
      # Supabase — Auth + Postgres (PostgREST) + Storage. Set these from your
      # Supabase project settings (Settings → API).
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Voyage embeddings for decision-memory RAG (Gap #3). Optional: without it the
      # uncertainty loop still works; only fleet lesson retrieval is disabled.
      - key: VOYAGE_API_KEY
        sync: false
