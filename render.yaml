# Render blueprint for the Trace cloud backend.
#
# "New → Blueprint" in Render reads this file and provisions the web service
# (built from the Dockerfile). Database is hosted on Supabase (external).
# Render prompts for the secret values marked `sync: false` — paste the values
# from your Supabase project settings + .env.example.
#
# Tier note: Starter (paid) is chosen deliberately — a free web service sleeps
# after ~15 min idle. Downgrade to free only for a throwaway one-off test.

services:
  - type: web
    name: trace-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health
    # NO PERSISTENT DISK, deliberately. Session artifacts — meta.json, connection.json,
    # specs/*.yaml — therefore live on the container filesystem and are DESTROYED on
    # every deploy and restart: a redeploy wipes in-progress work, and a session
    # mid-wizard can become silently ineligible for go-live.
    #
    # Accepted for now. A Render disk is billed per GB and pins the service to ONE
    # instance (no horizontal scaling, no zero-downtime deploys) — not worth it before
    # the product is polished.
    #
    # What made this DANGEROUS is already fixed in code and does not need a disk:
    # connection.json carries external_user_id, the key the per-agent memory store is
    # named after, and losing it once let deploys name a store with no owner in it that
    # two accounts could share. sessions.owner_of now resolves the owner from the
    # Supabase sessions row instead, and config.memory_store_name refuses to build a
    # nameless store. A wiped disk now costs work-in-progress, not isolation.
    #
    # When it is time: add a `disk:` block (1GB is plenty for JSON/YAML) plus
    # TRACE_SESSIONS_ROOT=/data/sessions — app.py already honours that env var, so no
    # code change is needed. Supabase Storage is the alternative and avoids the
    # single-instance constraint entirely.
    envVars:
      # Bind all interfaces in the cloud; Render injects $PORT automatically, so
      # PORT is not declared here. Locally, HOST defaults to 127.0.0.1.
      - key: HOST
        value: 0.0.0.0
      # Secrets — Render prompts for these on deploy; values never live in the repo.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PIPEDREAM_PROJECT_ID
        sync: false
      - key: PIPEDREAM_CLIENT_ID
        sync: false
      - key: PIPEDREAM_CLIENT_SECRET
        sync: false
      - key: PIPEDREAM_ENVIRONMENT
        sync: false
      # App session secret — Render generates a strong random value.
      - key: SESSION_SECRET
        generateValue: true
      # Admin portal token — any long random string; leave BLANK/unset to keep the
      # admin portal disabled (it fails closed).
      - key: TRACE_ADMIN_TOKEN
        sync: false
      # Email notifications (frame 18) and team invites. Both must be set for anything
      # to send; with either missing the app runs and notifications stay in-app only.
      # EMAIL_FROM must use a domain verified in Resend or every send is refused.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # IANA timezone for scheduled deployments' cron (e.g. America/New_York —
      # the default when unset). "Daily · 9am" fires at 9am in this zone.
      - key: TRACE_SCHEDULE_TZ
        sync: false
      # Supabase — Auth + Postgres (PostgREST) + Storage. Set these from your
      # Supabase project settings (Settings → API).
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Voyage embeddings for decision-memory RAG (Gap #3). Optional: without it the
      # uncertainty loop still works; only fleet lesson retrieval is disabled.
      - key: VOYAGE_API_KEY
        sync: false
