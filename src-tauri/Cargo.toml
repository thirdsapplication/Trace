[package]
name = "trace-desktop"
version = "0.1.0"
description = "Trace — local capture + end-user UI, driving the cloud pipeline"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"

[features]
# Tauri's default custom-protocol feature for production builds.
custom-protocol = ["tauri/custom-protocol"]
