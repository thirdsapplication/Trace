<!doctype html>
<!-- Placeholder shown while the local node starts. The Rust shell navigates the
     window to http://127.0.0.1:<port>/app (the real end-user UI) once the node
     answers, and drives the status/error text below via window.__setStatus.
     Kept dependency-free and self-contained. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Palza</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; align-items: center; justify-content: center;
        font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #111; background: #fafafa;
      }
      .box { text-align: center; max-width: 440px; padding: 0 24px; }
      .dot { font-size: 22px; letter-spacing: 2px; }
      .muted { color: #888; margin-top: 8px; }
      .error { color: #b3261e; margin-top: 12px; display: none; }
      .logpath {
        display: none; margin-top: 10px; padding: 8px 10px;
        font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #555; background: #f0f0f0; border-radius: 6px;
        word-break: break-all; user-select: text; -webkit-user-select: text;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="dot">● Palza</div>
      <div class="muted" id="status">Starting…</div>
      <div class="error" id="error"></div>
      <div class="logpath" id="logpath"></div>
    </div>
    <script>
      // Driven by the shell: win.eval("__setStatus && __setStatus({...})").
      // {text} updates the status line; {error, logPath} switches to a visible
      // failure state pointing at the log file. No IPC — plain eval only.
      window.__setStatus = function (s) {
        s = s || {};
        var status = document.getElementById("status");
        var error = document.getElementById("error");
        var logpath = document.getElementById("logpath");
        if (s.text) status.textContent = s.text;
        if (s.error) {
          status.style.display = "none";
          error.textContent = s.error;
          error.style.display = "block";
          if (s.logPath) {
            logpath.textContent = "Details: " + s.logPath;
            logpath.style.display = "block";
          }
        }
      };
    </script>
  </body>
</html>
