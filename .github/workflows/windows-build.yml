# Windows desktop build: tests, a live capture session, and the installer.
#
# The Mac build is done by hand on a Mac (desktop/README.md). Windows has no
# machine of ours to build on, so this runner is it — and, just as importantly, it
# is the only place the Windows-only code paths (UI Automation, the window reader,
# the clipboard, the hidden console, the parent watchdog) actually execute.
#
# Output: the NSIS installer (Palza_<version>_x64-setup.exe) as a downloadable
# artifact on the run. Unsigned until a code-signing certificate is set up, so
# Windows SmartScreen will warn on install ("More info" -> "Run anyway").

name: windows-build

on:
  workflow_dispatch:
  push:
    branches: [windows-port, windows-build-ci]
    paths:
      - "trace/**"
      - "desktop/**"
      - "src-tauri/**"
      - "requirements.txt"
      - ".github/workflows/windows-build.yml"

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      # The suite must never reach the real Supabase project from CI.
      SUPABASE_URL: ""
      SUPABASE_ANON_KEY: ""
      SUPABASE_SERVICE_ROLE_KEY: ""
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Capture tests
        run: python -m pytest trace/tests/test_windows_capture.py trace/tests/test_ax.py trace/tests/test_keystrokes.py -q

      - name: Full test suite
        run: python -m pytest trace/tests -q

      - name: Live capture session (Notepad)
        run: python desktop/windows_smoke.py

      # Can the recorder see inside a web page with no extension installed? It can
      # (first measured 2026-09-29), and a tester without the extension depends on
      # it, so this now gates the build.
      - name: Live capture session (Chrome, no extension)
        run: python desktop/windows_smoke.py --chrome

      - name: Build the capture node (PyInstaller)
        run: |
          pyinstaller --noconfirm desktop/trace-node.spec
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          Copy-Item -Recurse -Force dist/trace-node src-tauri/binaries/trace-node

      # The packaged node must still reach UI Automation: comtypes bindings that
      # were not bundled fail silently, and the app would record no clicks.
      - name: Check the packaged node
        shell: pwsh
        run: |
          $env:HOST = "127.0.0.1"
          $env:PORT = "8799"
          $env:TRACE_CLOUD_BACKEND = "https://trace-backend-6nd8.onrender.com"
          $node = Start-Process -PassThru -FilePath "dist/trace-node/trace-node.exe" -ArgumentList "--no-open"
          $perm = $null
          foreach ($i in 1..60) {
            try { $perm = Invoke-RestMethod http://127.0.0.1:8799/api/permissions; break } catch { Start-Sleep 1 }
          }
          Stop-Process -Id $node.Id -Force -ErrorAction SilentlyContinue
          if (-not $perm) { throw "packaged node never answered /api/permissions" }
          $perm | ConvertTo-Json -Depth 4
          if ($perm.platform -ne "win32") { throw "unexpected platform $($perm.platform)" }
          if ($perm.accessibility.granted -ne $true) { throw "packaged node cannot reach UI Automation" }

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build the installer (Tauri)
        run: npx --yes @tauri-apps/cli@2 build

      # Install it the way a tester will, launch it, and check the whole startup:
      # the shell finds trace-node.exe, the node answers /health, the window loads.
      # Then kill the app outright — no clean exit — and check the node's watchdog
      # takes it down too, instead of leaving it running in the background.
      - name: Install and launch the app
        shell: pwsh
        run: |
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Start-Process $installer.FullName -ArgumentList "/S" -Wait
          $dir = Join-Path $env:LOCALAPPDATA "Palza"
          if (-not (Test-Path $dir)) { throw "installer did not create $dir" }
          $node = Get-ChildItem -Recurse $dir -Filter trace-node.exe | Select-Object -First 1
          if (-not $node) { throw "installed app has no trace-node.exe" }
          Write-Host "node: $($node.FullName)"
          $app = Get-ChildItem $dir -Filter *.exe | Where-Object { $_.Name -notlike "uninstall*" } | Select-Object -First 1
          Write-Host "app: $($app.FullName)"
          $log = Join-Path $env:APPDATA "com.trace.desktop\logs\trace-node.log"
          $p = Start-Process $app.FullName -PassThru
          $ok = $false
          foreach ($i in 1..120) {
            Start-Sleep 1
            if ((Test-Path $log) -and (Select-String -Path $log -Pattern "navigated to app" -Quiet)) { $ok = $true; break }
          }
          if (Test-Path $log) { Get-Content $log -Tail 40 }
          if (-not $ok) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue; throw "app never reached its UI" }
          Stop-Process -Id $p.Id -Force
          Start-Sleep 6
          $left = Get-Process trace-node -ErrorAction SilentlyContinue
          if ($left) { throw "trace-node kept running after the app was killed" }
          Write-Host "OK: installed, launched, loaded, and shut down cleanly"

      - uses: actions/upload-artifact@v4
        with:
          name: trace-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
