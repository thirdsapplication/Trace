# Windows desktop build: tests, a live capture session, and the installer.
#
# The Mac build is done by hand on a Mac (desktop/README.md). Windows has no
# machine of ours to build on, so this runner is it — and, just as importantly, it
# is the only place the Windows-only code paths (UI Automation, the window reader,
# the clipboard, the hidden console, the parent watchdog) actually execute.
#
# Output: the NSIS installer (Trace_<version>_x64-setup.exe) as a downloadable
# artifact on the run. Unsigned until a code-signing certificate is set up, so
# Windows SmartScreen will warn on install ("More info" -> "Run anyway").

name: windows-build

on:
  workflow_dispatch:
  push:
    branches: [windows-port, windows-build-ci]
    paths:
      - "trace/**"
      - "desktop/**"
      - "src-tauri/**"
      - "requirements.txt"
      - ".github/workflows/windows-build.yml"

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      # The suite must never reach the real Supabase project from CI.
      SUPABASE_URL: ""
      SUPABASE_ANON_KEY: ""
      SUPABASE_SERVICE_ROLE_KEY: ""
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Capture tests
        run: python -m pytest trace/tests/test_windows_capture.py trace/tests/test_ax.py trace/tests/test_keystrokes.py -q

      # The rest of the suite has never run on Windows. Reported, not gating, until
      # it has been through once and any path/permission assumptions are fixed.
      - name: Full test suite (informational)
        continue-on-error: true
        run: python -m pytest trace/tests -q

      - name: Live capture session (Notepad)
        run: python desktop/windows_smoke.py

      # Can the recorder see inside a web page with no extension installed? Reported
      # rather than gating: the answer decides whether a tester needs the extension,
      # and the installer should still be built either way.
      - name: Live capture session (Chrome, no extension)
        continue-on-error: true
        run: python desktop/windows_smoke.py --chrome

      - name: Build the capture node (PyInstaller)
        run: |
          pyinstaller --noconfirm desktop/trace-node.spec
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          Copy-Item -Recurse -Force dist/trace-node src-tauri/binaries/trace-node

      # The packaged node must still reach UI Automation: comtypes bindings that
      # were not bundled fail silently, and the app would record no clicks.
      - name: Check the packaged node
        shell: pwsh
        run: |
          $env:HOST = "127.0.0.1"
          $env:PORT = "8799"
          $env:TRACE_CLOUD_BACKEND = "https://trace-backend-6nd8.onrender.com"
          $node = Start-Process -PassThru -FilePath "dist/trace-node/trace-node.exe" -ArgumentList "--no-open"
          $perm = $null
          foreach ($i in 1..60) {
            try { $perm = Invoke-RestMethod http://127.0.0.1:8799/api/permissions; break } catch { Start-Sleep 1 }
          }
          Stop-Process -Id $node.Id -Force -ErrorAction SilentlyContinue
          if (-not $perm) { throw "packaged node never answered /api/permissions" }
          $perm | ConvertTo-Json -Depth 4
          if ($perm.platform -ne "win32") { throw "unexpected platform $($perm.platform)" }
          if ($perm.accessibility.granted -ne $true) { throw "packaged node cannot reach UI Automation" }

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build the installer (Tauri)
        run: npx --yes @tauri-apps/cli@2 build

      - uses: actions/upload-artifact@v4
        with:
          name: trace-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
