[pytest]
# Bare `pytest` used to walk into src-tauri/target/, where a release build vendors a
# whole Python runtime — including IPython's own test suite — and collection died on
# imports that have nothing to do with this project. Point pytest at our tests and keep
# build output out of the walk, so `pytest` and `pytest trace/tests` agree.
testpaths = trace/tests
norecursedirs = src-tauri build dist captures .git .claude node_modules *.egg-info
